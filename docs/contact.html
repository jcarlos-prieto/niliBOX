<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>niliBOX :: Contact</title>
  <link rel="icon" href="logo.ico" type="image/x-icon">
  <style>
     body {
      margin: 0;
      background-color: #FOFOFO;
      font-family: sans-serif;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }

    .header {
      background-color: #DCC5ED;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header img {
      height: 130px;
      object-fit: contain;
    }

    .menu {
      display: flex;
      gap: 20px;
      padding-right: 10px;
    }

    .menu a {
      color: #9F5FCF;
      text-decoration: none;
      transition: color 0.2s;
    }

    .menu a:hover {
      color: white;
    }

    .introduction {
      background-color: #303030;
      padding: 20px;
      font-size: 24px;
      color: white;
    }

    .introduction a {
      color: #8080F0;
      text-decoration: none;
    }

    .footer {
      background-color: #DCC5ED;
      color: #9F5FCF;
      padding: 10px;
      margin-top: 10px;
    }

    .form {
      background-color: #B0B0B0;
      padding: 10px;
      margin-top: 10px;
      font-size: 36px;
      font-weight: bold;
      color: white;
    }

    form {
      max-width: 500px;
      margin: auto;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    form input,
    form textarea {
      width: 92%;
      padding: 12px 16px;
      margin-bottom: 1.2rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    form input:focus,
    form textarea:focus {
      border-color: #007BFF;
      outline: none;
    }

    form textarea {
      min-height: 120px;
      resize: vertical;
    }

    form button {
      background-color: #DCC5ED;
      color: #9F5FCF;
      padding: 12px 20px;
      border: none;
      border-radius: 20px;
      font-size: 1rem;
      cursor: pointer;
    }

    form button:hover {
      background-color: #9F5FCF;
      color: white;
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .menu {
        flex-wrap: wrap;
        gap: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header class="header">
      <a href="https://nilibox.com"><img src="logo.png" alt="Logo"></a>
      <nav class="menu">
        <a href="https://nilibox.com">Home</a>
        <a href="https://nilibox.com/modules">Modules</a>
        <a href="https://nilibox.com/tutorials">Tutorials</a>
        <a href="https://nilibox.com/downloads">Downloads</a>
        <a href="https://nilibox.com/contact"><b>Contact</b></a>
      </nav>
    </header>
  </div>
  
  <div class="container">
    <section class="introduction">
      <p>We would like to hear from you. Leave us a message with your feedback here.</p>
      <p>Or join our <a href="https://www.facebook.com/groups/3031968940436466" target="_blank">facebook group</a></p>
      <p>Thanks!</p>
    </section>
  </div>

  <div class="container">
    <section class="form">
      <form target="_blank" action="https://formsubmit.co/dc139ebf82a82d2d4d0c746739ff9f7b" method="POST">
        <input type="text" name="name" placeholder="Name" required>
        <input type="email" name="email" placeholder="Email Address" required>
        <textarea placeholder="Your Message" name="message" rows="10" required></textarea>
        <button type="submit">Submit Form</button>
      </form>
    </section>
  </div>

  <div class="container">
    <header class="footer">
       <br><br>© 2025 - nilibox.com<br><br><br>
    </footer>
  </div>
</body>

</html>
